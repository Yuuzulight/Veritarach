[project]
name = "veritarach"
version = "0.1.0"
description = "AI-generated text detector — Telegraph Protocol Miner for the AI_DETECTION intent"
requires-python = ">=3.11"
dependencies = [
    "transformers",
    "datasets",
    "accelerate",
    "scikit-learn",
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "anthropic",
    "openai",
    "google-generativeai",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-mock",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veritarach"]
