# Real schema per docs.telegraphprotocol.com/miners/yaml-config.md (2026-08-13).
# REGISTERED AND ACTIVE as of 2026-08-15 -- on-chain registrationId 85, confirmed both via
# a direct eth_call to getMiner(85) (active == true) and against the node's own
# /api/miners catalog. Supersedes the original 2026-08-13 registration (registrationId 77,
# now deregistered), retired once the retrained model's real F1 was confirmed to differ from
# what that registration described. See registration/README.md for the full story, including
# a broken step in Telegraph's own site that had to be routed around with a direct
# registerMiner call.

version: "1"
kind: miner
id: 708425                # This repo's own application-level id, reused from the original
                          # registration -- registerMiner doesn't take id or slug as contract
                          # arguments at all (only yamlUrl, yamlHash, feeAddress,
                          # minPriceUsdc, supportedIntents), so reusing it was never actually
                          # at risk of an on-chain collision. Not the same number as the
                          # on-chain registrationId (85) -- that's a separate, sequential
                          # counter the contract assigns per registration.
slug: veritarach-ai-text-detector
protocol: generic        # not a Bittensor subnet wrapper -- our own FastAPI service.
name: Veritarach AI Text Detector
description: >
  Fine-tuned DeBERTa-v3-base binary classifier distinguishing AI-generated from
  human-written text. 99.86% test F1 on held-out HC3/Wikipedia/self-generated data;
  strongest on Q&A-style text similar to its training distribution.
base_url: https://157-230-241-156.sslip.io   # DigitalOcean droplet (Singapore), behind
                                              # Caddy for automatic HTTPS via a real
                                              # Let's Encrypt cert. Retrained and redeployed
                                              # 2026-08-15 -- verified live against real
                                              # held-out rows, not just /health.

auth:
  type: none              # /predict has no auth -- open endpoint.

endpoints:
  - path: /predict
    external_path: /predict
    method: POST
    description: Classify text as ai_generated or human_written with a confidence score.

semantics:
  signal_mapping:
    label_field: label
    confidence_field: confidence
  supported_intents:
    - AI_TEXT_DETECTION
    # Confirmed valid -- the sandbox accepted it and the on-chain registration succeeded.
    # yaml-config.md's general canonical list lists AI_DETECTION, not AI_TEXT_DETECTION,
    # but that doc table just hadn't caught up with the hackathon-specific intents.

# No on_chain block yet -- that's only needed for ERC-8183 job / x402 direct-payment
# support, not for basic hackathon Track 1 registration. Add later if we want that path;
# the exact transform_rule syntax for a string label field (vs. the boolean example in the
# docs) isn't confirmed yet, so it's left out rather than guessed at.
